name: Build WinCal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinCal.csproj

      - name: Build
        run: dotnet build WinCal.csproj -c Release --no-restore

      - name: Publish self-contained executable
        run: >
          dotnet publish WinCal.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinCal-win-x64
          path: dist/WinCal.exe
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release upload "$env:GITHUB_REF_NAME" dist/WinCal.exe --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" dist/WinCal.exe --generate-notes --title "$env:GITHUB_REF_NAME"
          }
